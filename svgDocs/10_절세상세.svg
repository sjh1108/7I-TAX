  <filter id="cs" x="-15%" y="-8%" width="130%" height="130%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
    <feOffset in="blur" dx="0" dy="4" result="off"/>
    <feFlood flood-color="#3629B7" flood-opacity="0.07" result="color"/>
    <feComposite in="color" in2="off" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="375" height="1050" fill="#FFFFFF"/>

