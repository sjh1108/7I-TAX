spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      host: localhost
      port: 6379

app:
  encryption:
    aes-key: tax7i-test-aes256-key-32bytes!!

jwt:
  secret: test-secret-key-must-be-at-least-32-bytes-long!!
  access-expiration: 1800000
  refresh-expiration: 604800000

ssafy:
  finance:
    base-url: https://finopenapi.ssafy.io/ssafy/api/v1/edu
    api-key: test-finance-api-key
    institution-code: "00100"
    fintech-app-no: "001"
  oauth:
    authorization-uri: https://project.ssafy.com/oauth/sso-check
    token-uri: https://project.ssafy.com/ssafy/oauth2/token
    user-info-uri: https://project.ssafy.com/ssafy/resources/userInfo
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/api/auth/callback
