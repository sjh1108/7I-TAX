spring:
  application:
    name: tax7i
  config:
    import: optional:classpath:application-local.yaml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tax_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:ssafy}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:default-secret}
  access-expiration: 1800000
  refresh-expiration: 604800000

app:
  encryption:
    aes-key: ${AES_256_KEY}

ssafy:
  finance:
    base-url: https://finopenapi.ssafy.io/ssafy/api/v1/edu
    api-key: ${SSAFY_FINANCE_API_KEY}
    institution-code: "00100"
    fintech-app-no: "001"
  oauth:
    authorization-uri: https://project.ssafy.com/oauth/sso-check
    token-uri: https://project.ssafy.com/ssafy/oauth2/token
    user-info-uri: https://project.ssafy.com/ssafy/resources/userInfo
    client-id: ${SSAFY_CLIENT_ID}
    client-secret: ${SSAFY_CLIENT_SECRET}
    redirect-uri: ${SSAFY_REDIRECT_URI}