<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        @page { size: A4; margin: 20mm; }
        body { font-family: 'NanumGothic', sans-serif; font-size: 10pt; line-height: 1.4; color: #000; }
        h1 { text-align: center; font-size: 16pt; margin-bottom: 4px; }
        h3 { font-size: 12pt; margin-top: 20px; margin-bottom: 8px; border-bottom: 1px solid #000; padding-bottom: 4px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
        th, td { border: 1px solid #333; padding: 4px 8px; }
        th { background-color: #e8e8e8; text-align: center; font-weight: bold; }
        td.label { background-color: #f5f5f5; width: 30%; font-weight: bold; }
        td.value { text-align: right; width: 20%; }
        .center { text-align: center; } .right { text-align: right; }
        .sub-header { text-align: center; font-size: 9pt; color: #555; margin-bottom: 16px; }
        .disclaimer { margin-top: 20px; padding: 8px; border: 1px solid #999; font-size: 8pt; color: #555; text-align: center; }
        .total-row td { font-weight: bold; background-color: #f0f0f0; }
    </style>
</head>
<body>

<h1>부가가치세 신고서</h1>
<p class="sub-header" th:text="${year} + '년 ' + ${half} + '기 (' + ${periodLabel} + ') | 7iTAX Simulation'">-</p>

<h3>사업자 정보</h3>
<table>
    <tr><td class="label">상호</td><td th:text="${businessName}">-</td><td class="label">사업자등록번호</td><td th:text="${regNumber}">-</td></tr>
    <tr><td class="label">대표자명</td><td th:text="${userName}">-</td><td class="label">과세기간</td><td th:text="${periodLabel}">-</td></tr>
</table>

<h3>매출세액</h3>
<table>
    <thead><tr><th style="width:40%">구분</th><th style="width:30%">공급가액</th><th style="width:30%">세액</th></tr></thead>
    <tbody>
        <tr>
            <td>카드 매출</td>
            <td class="right" th:text="${#numbers.formatInteger(salesAmount, 0, 'COMMA')} + ' 원'">0</td>
            <td class="right" th:text="${#numbers.formatInteger(salesVat, 0, 'COMMA')} + ' 원'">0</td>
        </tr>
        <tr class="total-row">
            <td class="label">매출 합계</td>
            <td class="value" th:text="${#numbers.formatInteger(salesAmount, 0, 'COMMA')} + ' 원'">0</td>
            <td class="value" th:text="${#numbers.formatInteger(salesVat, 0, 'COMMA')} + ' 원'">0</td>
        </tr>
    </tbody>
</table>

<h3>매입세액</h3>
<table>
    <thead><tr><th style="width:40%">구분</th><th style="width:30%">공급가액</th><th style="width:30%">세액</th></tr></thead>
    <tbody>
        <tr>
            <td>일반 매입</td>
            <td class="right" th:text="${#numbers.formatInteger(purchaseAmount, 0, 'COMMA')} + ' 원'">0</td>
            <td class="right" th:text="${#numbers.formatInteger(purchaseVat, 0, 'COMMA')} + ' 원'">0</td>
        </tr>
        <tr>
            <td>고정자산 매입</td>
            <td class="right" th:text="${#numbers.formatInteger(assetAmount, 0, 'COMMA')} + ' 원'">0</td>
            <td class="right" th:text="${#numbers.formatInteger(assetVat, 0, 'COMMA')} + ' 원'">0</td>
        </tr>
        <tr class="total-row">
            <td class="label">매입 합계</td>
            <td class="value" th:text="${#numbers.formatInteger(totalPurchaseAmount, 0, 'COMMA')} + ' 원'">0</td>
            <td class="value" th:text="${#numbers.formatInteger(totalPurchaseVat, 0, 'COMMA')} + ' 원'">0</td>
        </tr>
    </tbody>
</table>

<h3>납부세액 계산</h3>
<table>
    <tr><td class="label">차감 납부세액 (매출세액 - 매입세액)</td><td class="value" th:text="${#numbers.formatInteger(vatPayable, 0, 'COMMA')} + ' 원'">0</td></tr>
    <tr><td class="label">예정고지세액</td><td class="value" th:text="${#numbers.formatInteger(preliminaryPaid, 0, 'COMMA')} + ' 원'">0</td></tr>
    <tr class="total-row"><td class="label">최종 납부(환급)세액</td><td class="value" th:text="${#numbers.formatInteger(finalVat, 0, 'COMMA')} + ' 원'">0</td></tr>
</table>

<div class="disclaimer">본 문서는 7iTAX 시뮬레이션 환경에서 생성되었으며, 실제 납세증빙으로 사용할 수 없습니다.</div>

</body>
</html>
